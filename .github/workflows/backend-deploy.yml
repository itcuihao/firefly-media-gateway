name: Backend CI/CD

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

  bump-tag:
    name: Bump Tag
    runs-on: ubuntu-latest
    needs: test
    if: |
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      (
        startsWith(github.event.head_commit.message, 'release:') ||
        startsWith(github.event.head_commit.message, 'release(') ||
        contains(github.event.head_commit.message, '[release]')
      )
    outputs:
      tag: ${{ steps.tagger.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calculate and Push Next Tag
        id: tagger
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          LATEST_TAG=$(git tag -l 'v*' --sort=-v:refname | head -n 1)
          if [ -z "$LATEST_TAG" ]; then
            LATEST_TAG="v0.1.3"
          fi
          echo "Latest tag: $LATEST_TAG"

          VERSION_WITHOUT_V="${LATEST_TAG#v}"
          MAJOR=$(echo "$VERSION_WITHOUT_V" | cut -d. -f1)
          MINOR=$(echo "$VERSION_WITHOUT_V" | cut -d. -f2)
          PATCH=$(echo "$VERSION_WITHOUT_V" | cut -d. -f3)

          # Determine tag:
          # 1. Explicit tag specified (e.g. release: v1.0.0)
          # 2. Major bump: feat!:, fix!:, any!:, or BREAKING CHANGE:
          # 3. Minor bump: feat: or feat(scope):
          # 4. Patch bump: default for fix, chore, or general release
          COMMIT_MSG=$(git log -1 --pretty=%B)
          if echo "$COMMIT_MSG" | grep -qiE "^release(:[\t ]*|\([\w-]+\):[\t ]*)v[0-9]+\.[0-9]+\.[0-9]+"; then
            NEW_TAG=$(echo "$COMMIT_MSG" | grep -oiE "v[0-9]+\.[0-9]+\.[0-9]+" | head -n 1)
          elif echo "$COMMIT_MSG" | grep -qiE "(^[a-z]+(\(.*\))?!:|BREAKING[ -]CHANGE:|!:)"; then
            MAJOR=$((MAJOR + 1))
            MINOR=0
            PATCH=0
            NEW_TAG="v${MAJOR}.${MINOR}.${PATCH}"
          elif echo "$COMMIT_MSG" | grep -qiE "(^([a-z0-9_ -]+:[\t ]*)?feat(\(.*\))?:|feat:)"; then
            MINOR=$((MINOR + 1))
            PATCH=0
            NEW_TAG="v${MAJOR}.${MINOR}.${PATCH}"
          else
            PATCH=$((PATCH + 1))
            NEW_TAG="v${MAJOR}.${MINOR}.${PATCH}"
          fi

          echo "Generated next tag: $NEW_TAG"
          echo "tag=$NEW_TAG" >> "$GITHUB_OUTPUT"

          git tag -a "$NEW_TAG" -m "$COMMIT_MSG"
          git push origin "$NEW_TAG"

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [test, bump-tag]
    if: |
      always() &&
      (needs.test.result == 'success') &&
      (
        needs.bump-tag.result == 'success' ||
        startsWith(github.ref, 'refs/tags/v') ||
        github.event_name == 'workflow_dispatch'
      )
    steps:
      - name: Determine Deploy Tag
        id: resolve_tag
        run: |
          if [ -n "${{ needs.bump-tag.outputs.tag }}" ]; then
            DEPLOY_TAG="${{ needs.bump-tag.outputs.tag }}"
          else
            REF_NAME="${GITHUB_REF#refs/tags/}"
            REF_NAME="${REF_NAME#refs/heads/}"
            DEPLOY_TAG=$(echo "$REF_NAME" | sed 's/\//-/g')
          fi
          echo "Deploying version: $DEPLOY_TAG"
          echo "TAG=$DEPLOY_TAG" >> "$GITHUB_OUTPUT"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          timeout: 60s
          command_timeout: 15m
          script: |
            cd /opt/firefly-media-gateway
            git reset --hard
            git fetch --all --tags -f
            git checkout ${{ steps.resolve_tag.outputs.TAG }}
            # If it's a branch, pull the latest changes; if it's a tag, git pull might do nothing but checkout is sufficient.
            git pull || true
            docker build --build-arg VERSION=$(git rev-parse --short HEAD 2>/dev/null || echo unknown) -t firefly-media-gateway:${{ steps.resolve_tag.outputs.TAG }} -t firefly-media-gateway:latest .
            docker compose -f docker-compose.prod.yml up -d
            docker image prune -f
            sleep 5
            docker logs firefly-media-gateway --tail 30
            curl -sf http://localhost:${HOST_PORT:-9090}/api/v1/health
